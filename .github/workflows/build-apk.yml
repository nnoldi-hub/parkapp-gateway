name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # permite rulare manuală cu un click

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setare Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setare Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Permisiuni gradlew
        run: chmod +x gradlew

      - name: Build APK debug
        run: ./gradlew assembleDebug

      - name: Publicare APK ca artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkApp-Gateway-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
